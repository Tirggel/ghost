name: Build Ghost Desktop Releases (Linux, Windows, macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev libasound2-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install ObjectBox Native Library (Linux)
        run: |
          bash docs/installation/scripts/download.sh --install 5.3.2 Linux x86_64

      - name: Install Dart/Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Release
        run: flutter build linux --release

      - name: Package Linux Release Archive
        run: |
          mkdir -p ghost-releases/linux/scripts
          cp -r build/linux/x64/release/bundle/* ghost-releases/linux/
          if [ -f /usr/lib/libobjectbox.so ]; then
            cp /usr/lib/libobjectbox.so ghost-releases/linux/lib/
          fi
          cp scripts/stt.py scripts/tts.py scripts/system1_daemon.py ghost-releases/linux/scripts/
          tar -czvf ghost-linux-x64.tar.gz -C ghost-releases/linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-linux-x64
          path: ghost-linux-x64.tar.gz

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Download ObjectBox Native Library (Windows)
        shell: pwsh
        run: |
          $version = "5.3.2"
          $url = "https://github.com/objectbox/objectbox-c/releases/download/v$version/objectbox-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path "download/objectbox" | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "download/objectbox.zip"
          Expand-Archive -Path "download/objectbox.zip" -DestinationPath "download/objectbox" -Force

      - name: Install Dart/Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Release
        run: flutter build windows --release

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ghost-releases/windows/scripts" | Out-Null
          Copy-Item -Path "build/windows/x64/runner/Release/*" -Destination "ghost-releases/windows/" -Recurse -Force
          if (Test-Path "download/objectbox/lib/objectbox.dll") {
            Copy-Item -Path "download/objectbox/lib/objectbox.dll" -Destination "ghost-releases/windows/" -Force
          }
          Copy-Item -Path "scripts/stt.py", "scripts/tts.py", "scripts/system1_daemon.py" -Destination "ghost-releases/windows/scripts/" -Force
          Compress-Archive -Path "ghost-releases/windows/*" -DestinationPath "ghost-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-windows-x64
          path: ghost-windows-x64.zip

  build-macos:
    name: Build macOS (Universal / Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Download ObjectBox Native Library (macOS)
        run: |
          mkdir -p download/objectbox
          curl -L --fail -o download/objectbox.zip "https://github.com/objectbox/objectbox-c/releases/download/v5.3.2/objectbox-macos-universal.zip"
          unzip -o download/objectbox.zip -d download/objectbox
          sudo mkdir -p /usr/local/lib
          sudo cp download/objectbox/lib/libobjectbox.dylib /usr/local/lib/

      - name: Install Dart/Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter macOS Release
        run: flutter build macos --release

      - name: Package macOS Release Archive
        run: |
          mkdir -p ghost-releases/mac/scripts
          cp -R build/macos/Build/Products/Release/Ghost.app ghost-releases/mac/
          if [ -f download/objectbox/lib/libobjectbox.dylib ]; then
            mkdir -p ghost-releases/mac/Ghost.app/Contents/Frameworks
            cp download/objectbox/lib/libobjectbox.dylib ghost-releases/mac/Ghost.app/Contents/Frameworks/
          fi
          cp scripts/stt.py scripts/tts.py scripts/system1_daemon.py ghost-releases/mac/scripts/
          mkdir -p ghost-releases/mac/Ghost.app/Contents/Resources/scripts
          cp scripts/stt.py scripts/tts.py scripts/system1_daemon.py ghost-releases/mac/Ghost.app/Contents/Resources/scripts/
          cd ghost-releases/mac && zip -r ../../ghost-macos-universal.zip .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-macos-universal
          path: ghost-macos-universal.zip

  create-github-release:
    name: Publish GitHub Release (on Tag)
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ghost-linux-x64/ghost-linux-x64.tar.gz
            artifacts/ghost-windows-x64/ghost-windows-x64.zip
            artifacts/ghost-macos-universal/ghost-macos-universal.zip
          generate_release_notes: true
